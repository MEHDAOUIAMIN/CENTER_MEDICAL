<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription Medecin</title>
<link rel="stylesheet" href="style2.css">
</head>
<body>
<div class="login-container">
   <div class="login-box" style="width:420px;">
      <a href="login.html" style="text-decoration:none;color:#10b981;margin-bottom:15px;display:inline-block;">&larr; Retour a la connexion</a>
      <h2>Creer un compte medecin</h2>
      <p id="doctorRegisterMsg" style="font-weight:bold;"></p>
      <div id="doctorRegisterResult" style="display:none;margin-bottom:15px;padding:12px;border-radius:8px;background:#ecfdf5;border:1px solid #10b981;color:#065f46;">
         <div style="font-weight:700;">Votre ID medecin:</div>
         <div id="registeredDoctorId" style="font-size:22px;margin-top:6px;"></div>
         <div style="margin-top:8px;font-size:13px;">Gardez cet ID pour la connexion.</div>
      </div>
      <form id="doctorRegisterForm">
         <label>Code secret medecin</label>
         <input type="password" name="secret_code" required>
         <label>Nom complet</label>
         <input type="text" name="name" required>
         <label>Email</label>
         <input type="email" name="email" required>
         <label>Mot de passe</label>
         <input type="password" name="password" required>
         <label>Confirmer mot de passe</label>
         <input type="password" name="confirm_password" required>
         <label>Specialite</label>
         <select name="speciality_code" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;margin-bottom:20px;">
            <option value="">Choisir une specialite</option>
            <option value="01">01 - Cardiologie</option>
            <option value="02">02 - Dermatologie</option>
            <option value="03">03 - Pediatrie</option>
            <option value="04">04 - Neurologie</option>
            <option value="05">05 - Orthopedie</option>
            <option value="06">06 - Gynecologie</option>
            <option value="07">07 - Ophtalmologie</option>
            <option value="08">08 - ORL</option>
            <option value="09">09 - Radiologie</option>
            <option value="10">10 - Dentisterie</option>
         </select>
         <label>Telephone</label>
         <input type="text" name="phone">
         <label>Jours de travail</label>
         <input type="text" name="days" placeholder="Sat - Wed">
         <button type="submit" class="btn">Creer le compte</button>
      </form>
      <div style="margin-top:15px;">
         <a id="doctorLoginLink" href="login.html" style="color:#0f766e;padding:0;background:none;">Aller a la connexion</a>
      </div>
   </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
