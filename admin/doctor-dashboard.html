<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Doctor Dashboard</title>
<link rel="stylesheet" href="style2.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
      <h2 id="docNameSidebar">Dr. ...</h2>
      <a class="active" href="doctor-dashboard.html">Tableau de bord</a>
      <a href="doctor-appointments.html">Rendez-vous</a>
      <a href="change-password.html">Mot de passe</a>
      <a href="#" onclick="logout(); return false;">Deconnexion</a>
  </aside>
  <div class="main">
      <div class="topbar">
          <h1>Doctor Dashboard</h1>
          <div class="date" id="todayDate">...</div>
      </div>
      <div class="cards">
          <div class="card"><h3>Total Appointments</h3><p id="total">0</p></div>
          <div class="card"><h3>Today</h3><p id="today">0</p></div>
          <div class="card pending"><h3>Pending</h3><p id="pending">0</p></div>
          <div class="card done"><h3>Completed</h3><p id="done">0</p></div>
      </div>
      <div class="table-box">
          <h2>Last Appointments</h2>
          <table>
              <thead>
                  <tr>
                      <th>Patient</th>
                      <th>Date</th>
                      <th>Time</th>
                      <th>Status</th>
                  </tr>
              </thead>
              <tbody id="lastAppts">
                  <tr><td colspan="4">Loading...</td></tr>
              </tbody>
          </table>
      </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
