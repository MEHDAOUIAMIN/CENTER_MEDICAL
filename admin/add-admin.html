      <div class="form-box">
         <p id="addAdminMsg" style="display:none;font-weight:bold;"></p>
         <form id="addAdminForm">
            <label>Nom</label>
            <input type="text" name="name" required>
            <label>Email</label>

            <label>Mot de passe</label>
            <input type="password" name="password" required>
            <button type="submit" class="save">Creer Admin</button>
         </form>
      </div>
