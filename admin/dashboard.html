<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="style2.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="layout">
   <aside class="sidebar">
      <h2>Admin Panel</h2>
      <a class="active" href="dashboard.html">Dashboard</a>
      <a href="appointments.html">Appointments</a>
      <a href="doctors.html">Doctors</a>
      <a href="#" onclick="logout(); return false;">Logout</a>
   </aside>
   <main class="main">
      <div class="topbar">
         <h1 id="welcomeText">Dashboard</h1>
      </div>
      <div class="cards">
         <div class="card"><h3>Total Doctors</h3><p id="total_doctors">0</p></div>
         <div class="card"><h3>Total Appts</h3><p id="total_appointments">0</p></div>
         <div class="card"><h3>Today Appts</h3><p id="today_appointments">0</p></div>
         <div class="card pending"><h3>Pending</h3><p id="pending_appointments">0</p></div>
         <div class="card done"><h3>Completed</h3><p id="completed_appointments">0</p></div>
         <div class="card cancelled"><h3>Cancelled</h3><p id="cancelled_appointments">0</p></div>
      </div>
      <div class="charts-container" style="display:flex;gap:20px;margin-top:30px;">
         <div class="chart-box" style="flex:1;background:#fff;padding:20px;border-radius:10px;"><canvas id="statusChart"></canvas></div>
         <div class="chart-box" style="flex:1;background:#fff;padding:20px;border-radius:10px;"><canvas id="dailyChart"></canvas></div>
      </div>
   </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
