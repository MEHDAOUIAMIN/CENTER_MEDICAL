<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Changer Mot de Passe</title>
<link rel="stylesheet" href="style2.css">
</head>
<body>
<div class="login-container">
   <div class="login-box">
      <a href="#" onclick="history.back(); return false;" style="text-decoration:none;color:#10b981;margin-bottom:15px;display:inline-block;">&larr; Retour</a>
      <h2>Changer mot de passe</h2>
      <p id="changePasswordMsg" style="font-weight:bold;"></p>
      <form id="adminChangePasswordForm">
         <label>Mot de passe actuel</label>
         <input type="password" name="current_password" required>
         <label>Nouveau mot de passe</label>
         <input type="password" name="new_password" required>
         <label>Confirmer le nouveau mot de passe</label>
         <input type="password" name="confirm_password" required>
         <button type="submit" class="btn">Mettre a jour</button>
      </form>
   </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
