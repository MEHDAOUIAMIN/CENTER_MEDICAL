<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doctors List</title>
<link rel="stylesheet" href="style2.css">
</head>
<body>
<div class="layout">
   <aside class="sidebar">
      <h2>Admin Panel</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="appointments.html">Appointments</a>
      <a class="active" href="doctors.html">Doctors</a>
      <a href="add-doctor.html">Add Doctor</a>
      <a href="#" onclick="logout(); return false;">Logout</a>
   </aside>
   <main class="main">
      <div class="topbar">
         <h1>Doctors List</h1>
         <div style="display:flex;gap:10px;">
            <button class="update" style="margin-top:0;" onclick="window.print()">🖨️ Imprimer</button>
            <a href="add-doctor.html" class="save" style="margin-top:0;text-decoration:none;display:block;">+ Add Doctor</a>
         </div>
      </div>
      <input type="text" id="searchDoctor" style="padding:10px; width:300px; border-radius:5px; border:1px solid #ccc; margin-bottom: 20px;" placeholder="Rechercher par nom..." onkeyup="filterDoctors()">
      <div class="doctors-grid" id="doctorGrid">
         <p>Loading...</p>
      </div>
   </main>
</div>
<script src="js/app.js"></script>
<script>
function filterDoctors() {
    let input = document.getElementById("searchDoctor").value.toUpperCase();
    let cards = document.getElementById("doctorGrid").getElementsByClassName("doctor-card");
    for (let i = 0; i < cards.length; i++) {
        let name = cards[i].getElementsByTagName("h3")[0];
        if (name) {
            let txtValue = name.textContent || name.innerText;
            if (txtValue.toUpperCase().indexOf(input) > -1) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }       
    }
}
</script>
<style>
@media print {
    .sidebar, .topbar, #searchDoctor, .edit, .delete { display: none !important; }
    .layout { display: block; }
    .main { margin-left: 0; padding: 0; }
}
</style>
</body>
</html>
