<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ajouter Consultation</title>
<link rel="stylesheet" href="style2.css">
<style>
.form-box{background-color:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);max-width:600px;}
.form-box label{display:block;margin-top:15px;margin-bottom:5px;font-weight:bold;}
.form-box textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:4px;font-family:inherit;}
.form-box button{margin-top:20px;padding:12px;width:100%;background-color:#0f766e;color:#fff;border:none;border-radius:4px;cursor:pointer;}
</style>
</head>
<body>
<div class="layout">
   <aside class="sidebar">
      <h2 id="docNameSidebar">Dr. ...</h2>
      <a href="doctor-dashboard.html">Tableau de bord</a>
      <a class="active" href="doctor-appointments.html">Rendez-vous</a>
      <a href="#" onclick="logout(); return false;">Déconnexion</a>
   </aside>
   <main class="main">
      <div class="topbar"><h1>Nouvelle Consultation</h1></div>
      <div class="form-box">
         <form id="consultationForm">
            <label>Notes Médicales (Diagnostic, Traitement...)</label>
            <textarea id="notes" required></textarea>
            <button type="submit">Sauvegarder Consultation</button>
         </form>
      </div>
   </main>
</div>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    fetch('api_doctor_dashboard.php').then(res => res.json()).then(data => {
        if(data.status === 'success') document.getElementById('docNameSidebar').innerText = 'Dr. ' + data.data.doctor_name;
    });

    document.getElementById('consultationForm').addEventListener('submit', function(e){
        e.preventDefault();
        const apptId = new URLSearchParams(window.location.search).get('appt_id');
        const data = { appt_id: apptId, notes: document.getElementById('notes').value };
        fetch('api_add_consultation.php', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) })
        .then(r=>r.json()).then(data=>{
            if(data.status==='success') { alert('Consultation sauvegardée'); window.location.href='doctor-appointments.html'; }
            else alert(data.message);
        }).catch(()=>alert('Network Error'));
    });
});
</script>
</body>
</html>
