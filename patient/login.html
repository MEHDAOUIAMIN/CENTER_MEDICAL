<html lang="fr">
<head>

<title>Espace Patient</title>
<link rel="stylesheet" href="../admin/style2.css">
</head>
<body>
<div class="login-container">

      <a href="../index.html" style="text-decoration:none;color:#10b981;margin-bottom:15px;display:inline-block;">&larr; Retour a l'accueil</a>

      <p id="errorMsg" style="color:red; font-weight:bold;"></p>

         <input type="text" name="login_id" required>

         <button type="submit" class="btn">Connexion</button>
      </form>
      <div style="margin-top:15px;">
         <a href="register.html" style="color:#0f766e;padding:0;background:none;">Creer un compte</a>
      </div>
   </div>
</div>
