<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription Patient</title>
<link rel="stylesheet" href="../admin/style2.css">
</head>
<body>
<div class="login-container">
   <div class="login-box">
      <a href="../index.html" style="text-decoration:none;color:#10b981;margin-bottom:15px;display:inline-block;">&larr; Retour a l'accueil</a>
      <h2>Creer un compte patient</h2>
      <p id="registerMsg" style="font-weight:bold;"></p>
      <div id="registerResult" style="display:none;margin-bottom:15px;padding:12px;border-radius:8px;background:#ecfdf5;border:1px solid #10b981;color:#065f46;">
         <div style="font-weight:700;">Votre ID patient:</div>
         <div id="registeredPatientId" style="font-size:22px;margin-top:6px;"></div>
         <div style="margin-top:8px;font-size:13px;">Gardez cet ID pour la connexion.</div>
      </div>
      <form id="patientRegisterForm">
         <label>Nom complet</label>
         <input type="text" name="name" required>
         <label>Email</label>
         <input type="email" name="email" required>
         <label>Telephone</label>
         <input type="text" name="phone" required>
         <label>Mot de passe</label>
         <input type="password" name="password" required>
         <label>Confirmer le mot de passe</label>
         <input type="password" name="confirm_password" required>
         <button type="submit" class="btn">S'inscrire</button>
      </form>
      <div style="margin-top:15px;">
         <a id="patientLoginLink" href="login.html" style="color:#0f766e;padding:0;background:none;">J'ai deja un compte</a>
      </div>
   </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
